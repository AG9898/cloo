name: Release artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-root:
    name: npm package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pack launcher
        run: mkdir -p dist/npm && (cd npm && npm pack --ignore-scripts --pack-destination ../dist/npm)
      - uses: actions/upload-artifact@v4
        with:
          name: clooterminal-npm
          path: dist/npm/clooterminal-*.tgz

  native-binaries:
    name: ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            package: darwin-arm64
          - runner: macos-13
            target: x86_64-apple-darwin
            package: darwin-x64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            package: linux-arm64
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package: linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build release binary
        run: cargo build --locked --release --package cloo --target ${{ matrix.target }}
      - name: Pack optional dependency
        run: scripts/package-npm.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: clooterminal-${{ matrix.package }}
          path: dist/npm/clooterminal-${{ matrix.package }}-*.tgz
